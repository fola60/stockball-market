[project]
name = "stockball-worker"
version = "0.1.0"
description = "Stockball scheduled jobs and background worker service"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
    "curl_cffi==0.15.0",
    "requests==2.33.1",
    "selenium==4.43.0",
    "seleniumbase==4.48.4",
    "urllib3==2.6.3",
]

[project.scripts]
stockball-worker = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
