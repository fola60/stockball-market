[project]
name = "stockball-worker"
version = "0.1.0"
description = "Stockball scheduled jobs and background worker service"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.0,<6.0",
]

[project.scripts]
stockball-worker = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
