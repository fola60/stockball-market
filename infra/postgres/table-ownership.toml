# Which service may write each table. `scripts/check-table-ownership.py` enforces this in CI:
# every table created by a migration must be listed, and a service's code may only
# INSERT, UPDATE, or DELETE the tables it is listed as a writer of.
#
# `owner` is the service responsible for the table's meaning. `writers` is who may write it,
# with each exception to single ownership explained. Reads are unrestricted.
#
# Services: "api", "trading-engine", "worker".

# --- Trading engine: every change to cash, positions, prices, and trades ----------------------

[tables.instruments]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.instrument_price_curve_rebases]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.orders]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.trades]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.positions]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.cash_ledger_entries]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.price_snapshots]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.idempotency_keys]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.instrument_freezes]
owner = "trading-engine"
writers = ["trading-engine"]

[tables.portfolios]
owner = "trading-engine"
# The API creates an empty (zero-cash) portfolio with each account and removes it again if
# registration is rolled back. Every cash balance change goes through the engine's ledger.
writers = ["trading-engine", "api"]

# --- API: identity, sessions, and admin controls ---------------------------------------------

[tables.accounts]
owner = "api"
writers = ["api"]

[tables.auth_credentials]
owner = "api"
writers = ["api"]

[tables.user_sessions]
owner = "api"
writers = ["api"]

[tables.admin_audit_events]
owner = "api"
writers = ["api"]

[tables.runtime_settings]
owner = "api"
writers = ["api"]

[tables.job_runs]
owner = "worker"
# The admin API records runs it enqueues; the worker records their progress and outcome.
writers = ["worker", "api"]

