services:
  postgres:
    image: postgres:16-alpine
    cpu_shares: 2048
    mem_limit: 1536m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockball}
      POSTGRES_USER: ${POSTGRES_USER:-stockball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockball}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    environment:
      STOCKBALL_MIGRATION_DATABASE_URL: ${STOCKBALL_MIGRATION_DATABASE_URL:-postgresql://stockball:stockball@postgres:5432/stockball}
      STOCKBALL_MIGRATIONS_DIR: /migrations
    volumes:
      - ./scripts/migrate.sh:/opt/stockball/migrate.sh:ro
      - ./infra/postgres/migrations:/migrations:ro
    command: ["/bin/sh", "/opt/stockball/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    cpu_shares: 1024
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  trading-engine:
    cpu_shares: 2048
    mem_limit: 384m
    environment:
      STOCKBALL_TRADING_ENGINE_DATABASE_URL: ${STOCKBALL_TRADING_ENGINE_DATABASE_URL:-postgresql://stockball:stockball@postgres:5432/stockball}
      STOCKBALL_TRADING_ENGINE_BIND_ADDR: ${STOCKBALL_TRADING_ENGINE_BIND_ADDR:-0.0.0.0:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    cpu_shares: 2048
    mem_limit: 768m
    environment:
      STOCKBALL_API_DATABASE_URL: ${STOCKBALL_API_DATABASE_URL:-postgresql://stockball:stockball@postgres:5432/stockball}
      STOCKBALL_API_TRADING_ENGINE_URL: ${STOCKBALL_API_TRADING_ENGINE_URL:-http://trading-engine:3000}
      STOCKBALL_API_REDIS_URL: ${STOCKBALL_API_REDIS_URL:-redis://redis:6379/0}
      STOCKBALL_API_TRADING_QUEUE_NAME: ${STOCKBALL_API_TRADING_QUEUE_NAME:-stockball:worker:trading}
      STOCKBALL_API_INGESTION_QUEUE_NAME: ${STOCKBALL_API_INGESTION_QUEUE_NAME:-stockball:worker:ingestion}
      STOCKBALL_USER_OPENING_BALANCE: ${STOCKBALL_USER_OPENING_BALANCE:-100000.0000}
      STOCKBALL_DEV_PORTAL_ENABLED: ${STOCKBALL_DEV_PORTAL_ENABLED:-true}
      STOCKBALL_PLAYER_STATS_SCHEDULE_ENABLED: ${STOCKBALL_PLAYER_STATS_SCHEDULE_ENABLED:-true}
      STOCKBALL_PLAYER_STATS_SCHEDULE_HOUR_UTC: ${STOCKBALL_PLAYER_STATS_SCHEDULE_HOUR_UTC:-3}
      STOCKBALL_PLAYER_STATS_SCHEDULE_LEAGUE: ${STOCKBALL_PLAYER_STATS_SCHEDULE_LEAGUE:-9}
      STOCKBALL_PLAYER_STATS_SCHEDULE_SEASON: ${STOCKBALL_PLAYER_STATS_SCHEDULE_SEASON:-2025}
      STOCKBALL_BET365_SCHEDULE_ENABLED: ${STOCKBALL_BET365_SCHEDULE_ENABLED:-false}
      STOCKBALL_BET365_LIVE_SCHEDULE_ENABLED: ${STOCKBALL_BET365_LIVE_SCHEDULE_ENABLED:-false}
      STOCKBALL_BET365_LIVE_SCHEDULE_INTERVAL_MINUTES: ${STOCKBALL_BET365_LIVE_SCHEDULE_INTERVAL_MINUTES:-1}
      STOCKBALL_ENV_FILE_PATH: ${STOCKBALL_ENV_FILE_PATH:-/config/stockball.env}
      STOCKBALL_ENV_EXAMPLE_PATH: ${STOCKBALL_ENV_EXAMPLE_PATH:-/config/stockball.env.example}
    depends_on:
      postgres:
        condition: service_healthy
      trading-engine:
        condition: service_started
      redis:
        condition: service_healthy

  admin-ui:
    cpu_shares: 128
    mem_limit: 256m
    environment:
      NEXT_PUBLIC_STOCKBALL_API_URL: ${NEXT_PUBLIC_STOCKBALL_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_started

  web:
    cpu_shares: 1024
    mem_limit: 512m
    environment:
      STOCKBALL_API_URL: ${STOCKBALL_WEB_API_URL:-http://api:8000}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      api:
        condition: service_started

  worker:
    cpu_shares: 256
    mem_limit: 3g
    command:
      ["xvfb-run", "-a", "-s", "-screen 0 1920x1080x24", "stockball-worker", "worker"]
    init: true
    platform: linux/amd64
    profiles: ["worker"]
    environment:
      STOCKBALL_WORKER_DATABASE_URL: ${STOCKBALL_WORKER_DATABASE_URL:-postgresql://stockball:stockball@postgres:5432/stockball}
      STOCKBALL_WORKER_REDIS_URL: ${STOCKBALL_WORKER_REDIS_URL:-redis://redis:6379/0}
      STOCKBALL_WORKER_QUEUE_NAME: ${STOCKBALL_WORKER_TRADING_QUEUE_NAME:-stockball:worker:trading}
      STOCKBALL_WORKER_RETRY_QUEUE_NAME: ${STOCKBALL_WORKER_TRADING_RETRY_QUEUE_NAME:-stockball:worker:trading:retry}
      STOCKBALL_WORKER_TRADING_ENGINE_URL: ${STOCKBALL_WORKER_TRADING_ENGINE_URL:-http://trading-engine:3000}
      STOCKBALL_WORKER_LOG_LEVEL: ${STOCKBALL_WORKER_LOG_LEVEL:-INFO}
      STOCKBALL_WORKER_BLOCK_SECONDS: ${STOCKBALL_WORKER_BLOCK_SECONDS:-5}
      STOCKBALL_WORKER_RETRY_DELAY_SECONDS: ${STOCKBALL_WORKER_RETRY_DELAY_SECONDS:-30}
      STOCKBALL_WORKER_MAX_ATTEMPTS: ${STOCKBALL_WORKER_MAX_ATTEMPTS:-5}
      TZ: ${STOCKBALL_BET365_BROWSER_TIMEZONE:-Europe/Dublin}
      STOCKBALL_FBREF_BASE_URL: ${STOCKBALL_FBREF_BASE_URL:-https://fbref.com}
      STOCKBALL_FBREF_USER_AGENT: ${STOCKBALL_FBREF_USER_AGENT:-StockballMarketWorker/0.1;contact=engineering@stockball.local;provider=FBREF}
      STOCKBALL_FBREF_REQUEST_INTERVAL_SECONDS: ${STOCKBALL_FBREF_REQUEST_INTERVAL_SECONDS:-7.5}
      STOCKBALL_FBREF_CACHE_TTL_SECONDS: ${STOCKBALL_FBREF_CACHE_TTL_SECONDS:-86400}
      STOCKBALL_BET365_SCHEDULE_ENABLED: ${STOCKBALL_BET365_SCHEDULE_ENABLED:-false}
      STOCKBALL_BET365_LIVE_SCHEDULE_ENABLED: ${STOCKBALL_BET365_LIVE_SCHEDULE_ENABLED:-false}
      STOCKBALL_BET365_LIVE_SCHEDULE_INTERVAL_MINUTES: ${STOCKBALL_BET365_LIVE_SCHEDULE_INTERVAL_MINUTES:-1}
      STOCKBALL_BET365_LIVE_EVENT_WINDOW_MINUTES: ${STOCKBALL_BET365_LIVE_EVENT_WINDOW_MINUTES:-180}
      STOCKBALL_BET365_WEBSITE_URL: ${STOCKBALL_BET365_WEBSITE_URL:-https://www.bet365.com/#/HO/}
      STOCKBALL_BET365_WEBSITE_NAVIGATION_INTERVAL_SECONDS: ${STOCKBALL_BET365_WEBSITE_NAVIGATION_INTERVAL_SECONDS:-5}
      STOCKBALL_BET365_COMPETITION_NAME: ${STOCKBALL_BET365_COMPETITION_NAME:-Premier League}
      STOCKBALL_BET365_MAX_MATCHES: ${STOCKBALL_BET365_MAX_MATCHES:-20}
      STOCKBALL_BET365_PRE_MATCH_CUTOFF_MINUTES: ${STOCKBALL_BET365_PRE_MATCH_CUTOFF_MINUTES:-5}
      STOCKBALL_BET365_BROWSER_ENABLED: ${STOCKBALL_BET365_BROWSER_ENABLED:-false}
      STOCKBALL_BET365_BROWSER_IDLE_SECONDS: ${STOCKBALL_BET365_BROWSER_IDLE_SECONDS:-0.3}
      STOCKBALL_BET365_JOB_TIMEOUT_SECONDS: ${STOCKBALL_BET365_JOB_TIMEOUT_SECONDS:-600}
      STOCKBALL_SCHEDULED_REALTIME_MAX_LAG_SECONDS: ${STOCKBALL_SCHEDULED_REALTIME_MAX_LAG_SECONDS:-120}
      STOCKBALL_PLAYER_STATS_SCHEDULE_ENABLED: ${STOCKBALL_PLAYER_STATS_SCHEDULE_ENABLED:-true}
      STOCKBALL_PLAYER_STATS_SCHEDULE_HOUR_UTC: ${STOCKBALL_PLAYER_STATS_SCHEDULE_HOUR_UTC:-3}
      STOCKBALL_PLAYER_STATS_SCHEDULE_LEAGUE: ${STOCKBALL_PLAYER_STATS_SCHEDULE_LEAGUE:-9}
      STOCKBALL_PLAYER_STATS_SCHEDULE_SEASON: ${STOCKBALL_PLAYER_STATS_SCHEDULE_SEASON:-2025}
      STOCKBALL_TWITTER_BEARER_TOKEN: ${STOCKBALL_TWITTER_BEARER_TOKEN:-}
      STOCKBALL_TWITTER_SEARCH_QUERY: ${STOCKBALL_TWITTER_SEARCH_QUERY:-}
      STOCKBALL_TWITTER_QUERY_KEY: ${STOCKBALL_TWITTER_QUERY_KEY:-}
      STOCKBALL_TWITTER_POLICY_ACKNOWLEDGED: ${STOCKBALL_TWITTER_POLICY_ACKNOWLEDGED:-false}
      STOCKBALL_TWITTER_REQUEST_INTERVAL_SECONDS: ${STOCKBALL_TWITTER_REQUEST_INTERVAL_SECONDS:-1}
      STOCKBALL_TWITTER_MAX_RATE_LIMIT_SLEEP_SECONDS: ${STOCKBALL_TWITTER_MAX_RATE_LIMIT_SLEEP_SECONDS:-60}
      STOCKBALL_TWITTER_MAX_RESULTS: ${STOCKBALL_TWITTER_MAX_RESULTS:-100}
      STOCKBALL_TWITTER_MAX_PAGES_PER_POLL: ${STOCKBALL_TWITTER_MAX_PAGES_PER_POLL:-10}
      STOCKBALL_TWITTER_INJURY_SCHEDULE_ENABLED: ${STOCKBALL_TWITTER_INJURY_SCHEDULE_ENABLED:-false}
      STOCKBALL_TWITTER_INJURY_SCHEDULE_INTERVAL_MINUTES: ${STOCKBALL_TWITTER_INJURY_SCHEDULE_INTERVAL_MINUTES:-5}
      STOCKBALL_TWITTER_BROWSER_ENABLED: ${STOCKBALL_TWITTER_BROWSER_ENABLED:-false}
      STOCKBALL_TWITTER_BROWSER_USER_DATA_DIR: ${STOCKBALL_TWITTER_BROWSER_USER_DATA_DIR:-}
      STOCKBALL_TWITTER_BROWSER_PROFILE_DIRECTORY: ${STOCKBALL_TWITTER_BROWSER_PROFILE_DIRECTORY:-}
      STOCKBALL_SOCIAL_SIGNALS_ENABLED: ${STOCKBALL_SOCIAL_SIGNALS_ENABLED:-true}
      STOCKBALL_SOCIAL_SIGNAL_MAX_AGE_SECONDS: ${STOCKBALL_SOCIAL_SIGNAL_MAX_AGE_SECONDS:-3600}
    volumes:
      - ${MARKET_VALUES_DIR:-./services/worker/app/ingestion/market_values/archive (1)}:/data/market-values:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-engine:
        condition: service_started

  ingestion-worker:
    extends:
      service: worker
    cpu_shares: 256
    mem_limit: 3g
    environment:
      STOCKBALL_WORKER_QUEUE_NAME: ${STOCKBALL_WORKER_INGESTION_QUEUE_NAME:-stockball:worker:ingestion}
      STOCKBALL_WORKER_RETRY_QUEUE_NAME: ${STOCKBALL_WORKER_INGESTION_RETRY_QUEUE_NAME:-stockball:worker:ingestion:retry}

  scheduler:
    cpu_shares: 512
    mem_limit: 256m
    command: ["stockball-worker", "scheduler"]
    profiles: ["worker"]
    environment:
      STOCKBALL_WORKER_DATABASE_URL: ${STOCKBALL_WORKER_DATABASE_URL:-postgresql://stockball:stockball@postgres:5432/stockball}
      STOCKBALL_WORKER_REDIS_URL: ${STOCKBALL_WORKER_REDIS_URL:-redis://redis:6379/0}
      STOCKBALL_WORKER_TRADING_QUEUE_NAME: ${STOCKBALL_WORKER_TRADING_QUEUE_NAME:-stockball:worker:trading}
      STOCKBALL_WORKER_INGESTION_QUEUE_NAME: ${STOCKBALL_WORKER_INGESTION_QUEUE_NAME:-stockball:worker:ingestion}
      STOCKBALL_WORKER_STALE_RUNNING_JOB_SECONDS: ${STOCKBALL_WORKER_STALE_RUNNING_JOB_SECONDS:-7200}
      STOCKBALL_WORKER_TRADING_ENGINE_URL: ${STOCKBALL_WORKER_TRADING_ENGINE_URL:-http://trading-engine:3000}
      STOCKBALL_WORKER_LOG_LEVEL: ${STOCKBALL_WORKER_LOG_LEVEL:-INFO}
      STOCKBALL_WORKER_SCHEDULER_POLL_SECONDS: ${STOCKBALL_WORKER_SCHEDULER_POLL_SECONDS:-60}
      STOCKBALL_FBREF_BASE_URL: ${STOCKBALL_FBREF_BASE_URL:-https://fbref.com}
      STOCKBALL_FBREF_USER_AGENT: ${STOCKBALL_FBREF_USER_AGENT:-StockballMarketWorker/0.1;contact=engineering@stockball.local;provider=FBREF}
      STOCKBALL_FBREF_REQUEST_INTERVAL_SECONDS: ${STOCKBALL_FBREF_REQUEST_INTERVAL_SECONDS:-7.5}
      STOCKBALL_FBREF_CACHE_TTL_SECONDS: ${STOCKBALL_FBREF_CACHE_TTL_SECONDS:-86400}
      STOCKBALL_BET365_SCHEDULE_ENABLED: ${STOCKBALL_BET365_SCHEDULE_ENABLED:-false}
      STOCKBALL_BET365_LIVE_SCHEDULE_ENABLED: ${STOCKBALL_BET365_LIVE_SCHEDULE_ENABLED:-false}
      STOCKBALL_BET365_LIVE_SCHEDULE_INTERVAL_MINUTES: ${STOCKBALL_BET365_LIVE_SCHEDULE_INTERVAL_MINUTES:-1}
      STOCKBALL_BET365_LIVE_EVENT_WINDOW_MINUTES: ${STOCKBALL_BET365_LIVE_EVENT_WINDOW_MINUTES:-180}
      STOCKBALL_BET365_WEBSITE_URL: ${STOCKBALL_BET365_WEBSITE_URL:-https://www.bet365.com/#/HO/}
      STOCKBALL_BET365_WEBSITE_NAVIGATION_INTERVAL_SECONDS: ${STOCKBALL_BET365_WEBSITE_NAVIGATION_INTERVAL_SECONDS:-5}
      STOCKBALL_BET365_COMPETITION_NAME: ${STOCKBALL_BET365_COMPETITION_NAME:-Premier League}
      STOCKBALL_BET365_MAX_MATCHES: ${STOCKBALL_BET365_MAX_MATCHES:-20}
      STOCKBALL_BET365_PRE_MATCH_CUTOFF_MINUTES: ${STOCKBALL_BET365_PRE_MATCH_CUTOFF_MINUTES:-5}
      STOCKBALL_BET365_BROWSER_ENABLED: ${STOCKBALL_BET365_BROWSER_ENABLED:-false}
      STOCKBALL_BET365_BROWSER_IDLE_SECONDS: ${STOCKBALL_BET365_BROWSER_IDLE_SECONDS:-0.3}
      STOCKBALL_PLAYER_STATS_SCHEDULE_ENABLED: ${STOCKBALL_PLAYER_STATS_SCHEDULE_ENABLED:-true}
      STOCKBALL_PLAYER_STATS_SCHEDULE_HOUR_UTC: ${STOCKBALL_PLAYER_STATS_SCHEDULE_HOUR_UTC:-3}
      STOCKBALL_PLAYER_STATS_SCHEDULE_LEAGUE: ${STOCKBALL_PLAYER_STATS_SCHEDULE_LEAGUE:-9}
      STOCKBALL_PLAYER_STATS_SCHEDULE_SEASON: ${STOCKBALL_PLAYER_STATS_SCHEDULE_SEASON:-2025}
      STOCKBALL_TWITTER_BEARER_TOKEN: ${STOCKBALL_TWITTER_BEARER_TOKEN:-}
      STOCKBALL_TWITTER_SEARCH_QUERY: ${STOCKBALL_TWITTER_SEARCH_QUERY:-}
      STOCKBALL_TWITTER_QUERY_KEY: ${STOCKBALL_TWITTER_QUERY_KEY:-}
      STOCKBALL_TWITTER_POLICY_ACKNOWLEDGED: ${STOCKBALL_TWITTER_POLICY_ACKNOWLEDGED:-false}
      STOCKBALL_TWITTER_REQUEST_INTERVAL_SECONDS: ${STOCKBALL_TWITTER_REQUEST_INTERVAL_SECONDS:-1}
      STOCKBALL_TWITTER_MAX_RATE_LIMIT_SLEEP_SECONDS: ${STOCKBALL_TWITTER_MAX_RATE_LIMIT_SLEEP_SECONDS:-60}
      STOCKBALL_TWITTER_MAX_RESULTS: ${STOCKBALL_TWITTER_MAX_RESULTS:-100}
      STOCKBALL_TWITTER_MAX_PAGES_PER_POLL: ${STOCKBALL_TWITTER_MAX_PAGES_PER_POLL:-10}
      STOCKBALL_TWITTER_INJURY_SCHEDULE_ENABLED: ${STOCKBALL_TWITTER_INJURY_SCHEDULE_ENABLED:-false}
      STOCKBALL_TWITTER_INJURY_SCHEDULE_INTERVAL_MINUTES: ${STOCKBALL_TWITTER_INJURY_SCHEDULE_INTERVAL_MINUTES:-5}
      STOCKBALL_TWITTER_BROWSER_ENABLED: ${STOCKBALL_TWITTER_BROWSER_ENABLED:-false}
      STOCKBALL_TWITTER_BROWSER_USER_DATA_DIR: ${STOCKBALL_TWITTER_BROWSER_USER_DATA_DIR:-}
      STOCKBALL_TWITTER_BROWSER_PROFILE_DIRECTORY: ${STOCKBALL_TWITTER_BROWSER_PROFILE_DIRECTORY:-}
    volumes:
      - ${MARKET_VALUES_DIR:-./services/worker/app/ingestion/market_values/archive (1)}:/data/market-values:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-engine:
        condition: service_started

  bootstrap-dev-market:
    cpu_shares: 256
    mem_limit: 3g
    init: true
    platform: linux/amd64
    command:
      - xvfb-run
      - -a
      - -s
      - -screen 0 1920x1080x24
      - stockball-worker
      - bootstrap-dev-market
      - --target-trades-per-hour-per-instrument
      - ${STOCKBALL_BOOTSTRAP_TARGET_TRADES_PER_HOUR:-2}
      - --max-bots
      - ${STOCKBALL_BOOTSTRAP_MAX_BOTS:-5000}
      - --random-seed
      - ${STOCKBALL_BOOTSTRAP_RANDOM_SEED:-20260915}
      - --market-values-dir
      - /data/market-values
      - --ingest-data
      - --commit
    profiles: ["bootstrap"]
    environment:
      STOCKBALL_WORKER_DATABASE_URL: ${STOCKBALL_WORKER_DATABASE_URL:-postgresql://stockball:stockball@postgres:5432/stockball}
      STOCKBALL_WORKER_REDIS_URL: ${STOCKBALL_WORKER_REDIS_URL:-redis://redis:6379/0}
      STOCKBALL_WORKER_TRADING_ENGINE_URL: ${STOCKBALL_WORKER_TRADING_ENGINE_URL:-http://trading-engine:3000}
      STOCKBALL_WORKER_API_URL: ${STOCKBALL_WORKER_API_URL:-http://api:8000}
      STOCKBALL_FBREF_BASE_URL: ${STOCKBALL_FBREF_BASE_URL:-https://fbref.com}
      STOCKBALL_FBREF_USER_AGENT: ${STOCKBALL_FBREF_USER_AGENT:-StockballMarketWorker/0.1;contact=engineering@stockball.local;provider=FBREF}
      STOCKBALL_FBREF_REQUEST_INTERVAL_SECONDS: ${STOCKBALL_FBREF_REQUEST_INTERVAL_SECONDS:-7.5}
      STOCKBALL_FBREF_CACHE_TTL_SECONDS: ${STOCKBALL_FBREF_CACHE_TTL_SECONDS:-86400}
    volumes:
      - ${MARKET_VALUES_DIR:-./services/worker/app/ingestion/market_values/archive (1)}:/data/market-values:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-engine:
        condition: service_started
      api:
        condition: service_started

volumes:
  postgres-data:
