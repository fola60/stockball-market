name: CI

on:
  pull_request:
  push:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check app tests
      - run: pyright
      - run: pytest -q

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trading-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q packages/contracts/tests
