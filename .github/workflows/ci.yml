name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/fola60/stockball-market

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [api, worker]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check app tests
      - run: pyright
      - run: pytest -q

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockball_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockball_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STOCKBALL_TRADING_ENGINE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stockball_test
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: services/trading-engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply database migrations
        working-directory: .
        env:
          STOCKBALL_MIGRATION_DATABASE_URL: ${{ env.STOCKBALL_TRADING_ENGINE_TEST_DATABASE_URL }}
        run: |
          scripts/migrate.sh
          scripts/migrate.sh
          expected_count="$(find infra/postgres/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          actual_count="$(psql "$STOCKBALL_MIGRATION_DATABASE_URL" -At -c 'SELECT count(*) FROM stockball_schema_migrations')"
          test "$actual_count" -eq "$expected_count"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/admin-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: validation-only
      IMAGE_TAG: validation-only
      DOMAIN: example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n scripts/deploy-production.sh scripts/backup-postgres.sh
      - run: sh -n scripts/migrate.sh
      - run: docker compose -f docker-compose.yml -f compose.dev.yml config --quiet
      - run: docker compose --profile worker -f docker-compose.yml -f compose.prod.yml config --quiet
      - run: docker compose --profile bootstrap -f docker-compose.yml -f compose.prod.yml config --quiet

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q packages/contracts/tests

  publish-images:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [python, rust, admin-ui, web, compose, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: services/api/Dockerfile
          - image: worker
            context: .
            dockerfile: services/worker/Dockerfile
          - image: trading-engine
            context: .
            dockerfile: services/trading-engine/Dockerfile
          - image: admin-ui
            context: .
            dockerfile: services/admin-ui/Dockerfile
          - image: web
            context: ./apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-production:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: [publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: prod
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure deployment SSH key
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Package deployment files
        run: |
          tar -czf "/tmp/stockball-deploy-${GITHUB_SHA}.tar.gz" \
            docker-compose.yml \
            compose.prod.yml \
            infra/caddy/Caddyfile \
            infra/postgres/migrations \
            infra/systemd \
            scripts/migrate.sh \
            scripts/backup-postgres.sh \
            scripts/deploy-production.sh
      - name: Upload deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          remote_bundle="/opt/stockball/.deploy-${GITHUB_SHA}.tar.gz"
          scp "/tmp/stockball-deploy-${GITHUB_SHA}.tar.gz" "${VPS_USER}@${VPS_HOST}:${remote_bundle}"
          ssh "${VPS_USER}@${VPS_HOST}" \
            "tar -xzf '${remote_bundle}' -C /opt/stockball && unlink '${remote_bundle}' && chmod 0755 /opt/stockball/scripts/*.sh"
      - name: Deploy production release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "/opt/stockball/scripts/deploy-production.sh '${GITHUB_SHA}'"
